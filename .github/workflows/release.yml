name: Prepare tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'henrikogaard/vaken'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - name: Check out tag without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate tag, committed version and previous release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-metadata.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" \
            --check-remote --github-output "$GITHUB_OUTPUT"
      - name: Test without signing credentials
        run: |
          swift test
          python3 -m unittest discover -s Tests/ReleaseToolsTests -v
      - name: Sign, notarize, staple and prepare Sparkle assets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VAKEN_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          VAKEN_FEED_URL: ${{ steps.metadata.outputs.feed_url }}
          VAKEN_DOWNLOAD_PREFIX: ${{ steps.metadata.outputs.download_prefix }}
          VAKEN_VERSION: ${{ steps.metadata.outputs.version }}
          VAKEN_BUILD_NUMBER: ${{ steps.metadata.outputs.build }}
        run: bash scripts/ci-release.sh
      - name: Upload verified distribution files only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/release-assets/Vaken.zip
            build/release-assets/appcast.xml
            build/release-assets/SHA256SUMS
            build/release-assets/Vaken.dmg
            build/release-assets/Vaken.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's distribution files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify checksums
        working-directory: release-assets
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check Vaken.dmg.sha256
      - name: Create draft for the existing tag
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_BUILD: ${{ needs.package.outputs.build }}
        run: |
          cat > release-notes.md <<EOF
          Vaken $RELEASE_VERSION, build $RELEASE_BUILD.

          Requires macOS 13 or later. This archive supports Apple Silicon only.
          Developer ID signed, notarized and stapled. Sparkle archive signature verified.

          Install: open Vaken.dmg, drag Vaken.app to Applications, eject the disk image,
          then launch Vaken from Applications and approve the helper when requested.
          Vaken.zip is the Sparkle update archive and remains available for manual use.

          Maintainer review required before publishing: complete the release checklist
          in docs/releases.md, including the signed old-to-new update test.
          EOF
          gh release create "$RELEASE_TAG" Vaken.dmg Vaken.dmg.sha256 Vaken.zip appcast.xml SHA256SUMS \
            --verify-tag --draft --title "Vaken $RELEASE_VERSION" --notes-file release-notes.md
